service: linklift-api

image: robfrank/linklift-api

servers:
  web:
    - <%= ENV["HOST_IP"] %>

proxy:
  ssl: false
  host: linklift.arcadebrain.ai
  app_port: 7070
  healthcheck:
    path: /up

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  server: ghcr.io
  username: robfrank

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
env:
  clear:
    # Kamal names accessory containers <service>-<accessory>
    JAVA_OPTS: "-Xmx2G -Dlinklift.arcadedb.host=linklift-api-arcadedb"
    LINKLIFT_OLLAMA_URL: "http://linklift-api-ollama:11434"
    LINKLIFT_OLLAMA_MODEL: "all-minilm:l6-v2"
    LINKLIFT_OLLAMA_DIMENSIONS: "384"
  secret:
    - LINKLIFT_JWT_SECRET

ssh:
  user: player

accessories:
  arcadedb:
    # arcadedb-headless has no 26.11.1 release; the full image does (LSM_VECTOR needs it)
    image: arcadedata/arcadedb:26.11.1@sha256:22a049898f34f01c256b56a1ba95fb01d32e5e14755d3c4367415c8e55ae5035
    host: <%= ENV["HOST_IP"] %>
    volumes:
      - /home/player/linklift/config:/home/arcadedb/config
      - /home/player/linklift/databases:/home/arcadedb/databases
      - /home/player/linklift/log:/home/arcadedb/log
    env:
      clear:
        JAVA_OPTS: "-Darcadedb.server.plugins=Postgres:com.arcadedb.postgres.PostgresProtocolPlugin -Darcadedb.server.mode=production"

  ollama:
    image: ollama/ollama:0.40.16@sha256:a372a1c0d1e15b68e9521189785c3ca17795c26c2356f8b1b10122cfb59ed0d7
    host: <%= ENV["HOST_IP"] %>
    port: 11434
    volumes:
      - /home/player/linklift/ollama:/root/.ollama
    cmd: serve
