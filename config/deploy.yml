service: linklift-api

image: robfrank/linklift-api

servers:
  web:
    - <%= ENV["HOST_IP"] %>

proxy:
  ssl: false
  host: linklift.arcadebrain.ai
  app_port: 7070
  healthcheck:
    path: /up

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  server: ghcr.io
  username: robfrank

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
env:
  clear:
    JAVA_OPTS: "-Xmx2G -Dlinklift.arcadedb.host=linklift-arcadedb"
    LINKLIFT_OLLAMA_URL: "http://linklift-ollama:11434"
    LINKLIFT_OLLAMA_MODEL: "all-minilm:l6-v2"
    LINKLIFT_OLLAMA_DIMENSIONS: "384"
  secret:
    - LINKLIFT_JWT_SECRET

ssh:
  user: player

accessories:
  arcadedb:
    image: arcadedata/arcadedb-headless:26.11.1
    host: <%= ENV["HOST_IP"] %>
    volumes:
      - /home/player/linklift/config:/home/arcadedb/config
      - /home/player/linklift/databases:/home/arcadedb/databases
      - /home/player/linklift/log:/home/arcadedb/log
    env:
      clear:
        JAVA_OPTS: "-Darcadedb.server.plugins=Postgres:com.arcadedb.postgres.PostgresProtocolPlugin -Darcadedb.server.mode=production"

  ollama:
    image: ollama/ollama:0.40.15@sha256:a717bfc1c56acfc2e85d3109bd40a7646258ec9062c40cea83b9ed0927eb4223
    host: <%= ENV["HOST_IP"] %>
    port: 11434
    volumes:
      - /home/player/linklift/ollama:/root/.ollama
    cmd: serve
